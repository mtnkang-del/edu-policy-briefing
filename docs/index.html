<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="대한민국 교육정책·교육부 관련 국내외 뉴스 자동 브리핑" />
  <title>EDU Policy Brief — 교육정책 데일리 브리핑</title>
  <style>
    :root{--bg:#f5f7fb;--paper:#fff;--ink:#13223a;--muted:#677489;--line:#dfe5ee;--navy:#17355c;--soft:#edf3ff;--radius:16px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}header{background:linear-gradient(135deg,#102947,#1d4c7b);color:#fff;padding:32px 0 28px}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-end}.brand small{opacity:.75;letter-spacing:.13em}.brand h1{margin:4px 0 0;font-size:clamp(25px,4vw,40px);letter-spacing:-.04em}.stamp{text-align:right;font-size:13px;opacity:.85}main{padding:24px 0 60px}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 22px rgba(20,42,75,.05)}.brief{padding:24px}.brief h2{margin:0 0 14px;font-size:19px}.brief ol{padding-left:22px;margin:0}.brief li{padding:7px 0;font-weight:650}.stats{padding:18px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f7f9fc;border-radius:12px;padding:14px}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 14px}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-size:13px;cursor:pointer}.btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}.search{margin-left:auto;min-width:220px;border:1px solid var(--line);border-radius:999px;padding:9px 14px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px}.section-title h2{font-size:20px;margin:0}.section-title span{color:var(--muted);font-size:12px}#list{display:grid;gap:11px}.news{padding:18px 19px;display:grid;grid-template-columns:1fr auto;gap:15px}.news:hover{border-color:#b9cae4}.meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:7px}.pill{padding:2px 7px;border-radius:999px;background:#eef2f7}.pill.official{background:#e8f1ff;color:#174c94}.pill.foreign{background:#fff5df;color:#81540a}.news h3{font-size:17px;line-height:1.4;margin:0 0 7px;letter-spacing:-.015em}.news p{margin:0;color:#4f5d70;font-size:14px}.original{margin-top:4px!important;color:#8590a0!important;font-size:12px!important}.imp{margin-top:8px!important;color:#17355c!important;font-weight:600}.open{align-self:center;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--navy);white-space:nowrap;font-size:13px}.empty{padding:50px;text-align:center;color:var(--muted)}footer{color:var(--muted);font-size:12px;padding:18px 0 36px}.notice{margin-top:12px;color:#7b8799;font-size:12px}.live{display:inline-flex;align-items:center;gap:7px}.dot{width:8px;height:8px;background:#44cf72;border-radius:50%;box-shadow:0 0 0 5px rgba(68,207,114,.12)}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.stamp{text-align:left}.search{width:100%;margin-left:0}.news{grid-template-columns:1fr}.open{justify-self:start}}
  </style>
</head>
<body>
<header><div class="wrap top"><div class="brand"><small>MINISTRY & EDUCATION INTELLIGENCE</small><h1>교육정책 데일리 브리핑</h1></div><div class="stamp"><div class="live"><span class="dot"></span><b>매일 자동 갱신</b></div><div id="updated">데이터 불러오는 중…</div></div></div></header>
<main class="wrap">
  <div class="grid"><section class="card brief"><h2>오늘 교육부가 봐야 할 것</h2><ol id="briefing"></ol><div class="notice" id="aiNote"></div></section><aside class="card stats"><div class="stat"><b id="stTotal">-</b><span>수집 기사</span></div><div class="stat"><b id="stOfficial">-</b><span>교육부 공식</span></div><div class="stat"><b id="stDomestic">-</b><span>국내 언론</span></div><div class="stat"><b id="stForeign">-</b><span>해외 언론</span></div></aside></div>
  <div class="toolbar" id="filters"><button class="btn active" data-filter="all">전체</button><button class="btn" data-filter="official">교육부 공식</button><button class="btn" data-filter="domestic">국내</button><button class="btn" data-filter="foreign">외신</button><button class="btn" data-category="입시·사교육">입시·사교육</button><button class="btn" data-category="유·초중등">유·초중등</button><button class="btn" data-category="고등교육">고등교육</button><button class="btn" data-category="교원·조직">교원·조직</button><button class="btn" data-category="AI·디지털">AI·디지털</button><button class="btn" data-category="재정·법령">재정·법령</button><input class="search" id="search" placeholder="정책·기관·키워드 검색" /></div>
  <div class="section-title"><h2>주요 뉴스</h2><span id="count"></span></div><section id="list"></section>
</main>
<footer class="wrap">원문 저작권은 각 언론사와 기관에 있습니다. 외신은 한국어 번역·요약을 제공하며 원문 제목도 함께 표시합니다. 데이터는 최근 30일만 보관합니다.</footer>
<script>
let DATA={items:[]},mode='all',category='',query='';
const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
function dateText(s){try{return new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(s))}catch{return ''}}
function render(){
 const items=DATA.items.filter(x=>(mode==='all'||x.kind===mode)&&(!category||x.category===category)&&(!query||(`${x.title} ${x.titleKo||''} ${x.source} ${x.description} ${x.summary||''} ${x.summaryKo||''}`).toLowerCase().includes(query)));
 document.querySelector('#count').textContent=`${items.length}건`;
 document.querySelector('#list').innerHTML=items.length?items.map(x=>{const title=x.kind==='foreign'?(x.titleKo||x.title):x.title;const body=x.kind==='foreign'?(x.summaryKo||x.summary||x.description):(x.summary||x.description);const original=x.kind==='foreign'&&x.titleKo?`<p class="original">원제 · ${esc(x.originalTitle||x.title)}</p>`:'';return `<article class="card news"><div><div class="meta"><span class="pill ${esc(x.kind)}">${x.kind==='official'?'교육부':x.kind==='foreign'?'외신':'국내'}</span><span class="pill">${esc(x.category)}</span><span>${esc(x.source)}</span><span>${dateText(x.publishedAt)}</span></div><h3>${esc(title)}</h3>${original}<p>${esc(body||'원문에서 자세한 내용을 확인하세요.')}</p>${x.implication?`<p class="imp">정책 시사점 · ${esc(x.implication)}</p>`:''}</div><a class="open" target="_blank" rel="noopener noreferrer" href="${esc(x.url)}">언론사 원문 ↗</a></article>`}).join(''):'<div class="card empty">조건에 맞는 뉴스가 없습니다.</div>';
}
fetch('./data/news.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;document.querySelector('#updated').textContent=`${d.date} 브리핑 · ${new Date(d.generatedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`;document.querySelector('#briefing').innerHTML=(d.briefing||[]).map(x=>`<li>${esc(x)}</li>`).join('');const notes=[];notes.push(d.aiSummaryEnabled?'AI 정책 요약 사용 중':'AI 정책 요약 미사용');notes.push(d.foreignTranslationEnabled?'외신 한국어 번역 사용 중':'외신 번역은 OPENAI_API_KEY 설정 후 자동 적용');notes.push(`최근 ${d.retentionDays||30}일 데이터 보관`);document.querySelector('#aiNote').textContent=notes.join(' · ');['Total','Official','Domestic','Foreign'].forEach(k=>document.querySelector('#st'+k).textContent=d.stats[k.toLowerCase()]??0);render()}).catch(()=>{document.querySelector('#briefing').innerHTML='<li>데이터 갱신이 아직 실행되지 않았습니다.</li>'});
document.querySelector('#filters').addEventListener('click',e=>{if(!e.target.matches('button'))return;document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');if(e.target.dataset.filter){mode=e.target.dataset.filter;category=''}else{mode='all';category=e.target.dataset.category||''}render()});document.querySelector('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
</script>
</body></html>
